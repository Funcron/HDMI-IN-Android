plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.funcron.hdmi_in_android'
    compileSdk 34

    defaultConfig {
        applicationId "com.funcron.hdmi_in_android"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "0.4"

        // Keep the APK small: all modern phones are arm64 (older ones armeabi-v7a).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // One fixed debug key shared by every build (local and CI). Without it each CI run
    // generates a fresh random key, and Android refuses to update over an earlier install.
    // This is a public debug key: fine for a personal app, not something to publish with.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // UVC (USB Video Class) camera access without root
    implementation 'com.herohan:UVCAndroid:1.0.13'
}
